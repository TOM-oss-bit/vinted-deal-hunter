
name: Vinted Deal Hunter Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test połączenia z Discordem
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = os.environ.get("DISCORD_WEBHOOK", "").strip()
          if not url.startswith("https://discord.com/api/webhooks/"):
              raise SystemExit("Sekret jest pusty lub ma nieprawidłowy format.")

          req = urllib.request.Request(
              url,
              data=json.dumps({
                  "content": "✅ Vinted Deal Hunter: test z GitHub Actions"
              }).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  print("Discord HTTP:", response.status)
          except urllib.error.HTTPError as e:
              print("Discord HTTP:", e.code)
              print("Odpowiedź:", e.read(500).decode("utf-8", "replace"))
              raise SystemExit(1)
          PY
