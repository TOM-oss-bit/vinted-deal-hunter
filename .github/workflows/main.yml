

name: Vinted Deal Hunter Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test połączenia z Discordem
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python -c "import os, urllib.request, json; u=os.environ.get('DISCORD_WEBHOOK',''); assert u.startswith('https://'), 'Brak sekretu DISCORD_WEBHOOK'; r=urllib.request.Request(u, data=json.dumps({'content':'✅ Vinted Deal Hunter: połączenie z GitHub Actions działa!'}).encode(), headers={'Content-Type':'application/json'}, method='POST'); print('Discord HTTP:', urllib.request.urlopen(r, timeout=15).status)"
